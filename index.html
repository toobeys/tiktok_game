<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBG Racing - 2 Layer Parallax Sawit</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-green: #22c55e;
      --accent-blue: #3b82f6;
      --accent-pink: #ec4899;
      --accent-red: #ef4444;
      --text-light: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #020617;
      color: var(--text-light);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    .mobile-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 450px;
      height: 92vh;
      max-height: 900px;
      background: var(--card-bg);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      border: 2px solid #334155;
    }

    .game-section {
      position: relative;
      width: 100%;
      flex: 1;
      background-color: #0284c7;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .controls-section {
      background: #0f172a;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 2px solid #334155;
    }

    .input-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .input-group label {
      font-size: 0.75rem;
      color: #94a3b8;
      white-space: nowrap;
    }

    input[type="text"] {
      flex: 1;
      background: #1e293b;
      border: 1px solid #475569;
      padding: 6px 10px;
      border-radius: 6px;
      color: #fff;
      font-size: 0.8rem;
    }

    .btn {
      background: var(--accent-blue);
      color: white;
      border: none;
      padding: 8px 10px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-green { background: var(--accent-green); }
    .btn-pink { background: var(--accent-pink); }
    .btn-red { background: var(--accent-red); }
    .btn-orange { background: #f97316; }

    .gift-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center;
      z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal {
      background: var(--card-bg); width: 90%; max-width: 400px;
      max-height: 85vh; overflow-y: auto; border-radius: 12px; padding: 16px;
    }
    .asset-uploader-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .asset-item { background: #0f172a; padding: 8px; border-radius: 6px; border: 1px dashed #475569; }
    .asset-item label { font-size: 0.75rem; color: #cbd5e1; display: block; margin-bottom: 4px; }
    .preview-box { width: 100%; height: 45px; background: #1e293b; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .preview-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
  </style>
</head>
<body>

  <div class="mobile-container">
    <div class="game-section">
      <canvas id="gameCanvas"></canvas>
    </div>

    <div class="controls-section">
      <div class="input-group">
        <label>Viewer:</label>
        <input type="text" id="viewerName" value="Penonton_TikTok" placeholder="Nama viewer...">
        <button class="btn btn-green" id="openAssetModal">📁 Upload Aset</button>
      </div>

      <div class="input-group">
        <label>Tema Jalan:</label>
        <select id="themeSelect" onchange="setTheme(this.value)" style="flex:1;padding:8px;border-radius:8px;background:#1e293b;color:#fff;border:1px solid #334155;"></select>
      </div>

      <div class="gift-grid">
        <button class="btn btn-pink" onclick="triggerGift('rose')">🌹 Angkot Push</button>
        <button class="btn btn-red" onclick="triggerGift('meteor')">☄️ Meteor Api</button>
        <button class="btn btn-orange" onclick="triggerGift('truck')">🚚 Truk Sound</button>
        <button class="btn btn-blue" onclick="triggerGift('hero')">🦸 Luffy / Boost</button>
      </div>
    </div>
  </div>

  <!-- Modal Asset Manager -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 style="font-size: 1rem; margin-bottom: 10px;">Upload Aset Gambar Kustom</h2>
      <div class="asset-uploader-grid">
        <div class="asset-item">
          <label>1. Layer Belakang (Gunung/Langit - Fullscreen)</label>
          <input type="file" accept="image/*" onchange="uploadAsset(event, 'bgFar')">
          <div class="preview-box"><img id="prev_bgFar"></div>
        </div>
        <div class="asset-item">
          <label>2. Layer Gabungan (Sawit + Jalan + Tanah)</label>
          <input type="file" accept="image/*" onchange="uploadAsset(event, 'bgForeground')">
          <div class="preview-box"><img id="prev_bgForeground"></div>
        </div>
        <div class="asset-item">
          <label>3. Bodi Gran Max (PNG Transparan)</label>
          <input type="file" accept="image/*" onchange="uploadAsset(event, 'carBody')">
          <div class="preview-box"><img id="prev_carBody"></div>
        </div>
        <div class="asset-item">
          <label>4. Roda Mobil (PNG Transparan)</label>
          <input type="file" accept="image/*" onchange="uploadAsset(event, 'wheel')">
          <div class="preview-box"><img id="prev_wheel"></div>
        </div>
        <div class="asset-item">
          <label>5. Mobil Angkot</label>
          <input type="file" accept="image/*" onchange="uploadAsset(event, 'angkot')">
          <div class="preview-box"><img id="prev_angkot"></div>
        </div>
        <div class="asset-item">
          <label>6. Meteor Api (PNG)</label>
          <input type="file" accept="image/*" onchange="uploadAsset(event, 'meteor')">
          <div class="preview-box"><img id="prev_meteor"></div>
        </div>
        <div class="asset-item">
          <label>7. Truk Sound Horeg</label>
          <input type="file" accept="image/*" onchange="uploadAsset(event, 'truck')">
          <div class="preview-box"><img id="prev_truck"></div>
        </div>
      </div>
      <div style="margin-top: 12px; display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn btn-red" onclick="clearAssets()">Reset</button>
        <button class="btn btn-green" id="closeAssetModal">Simpan</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const assets = {
      bgFar: new Image(),
      bgForeground: new Image(),
      carBody: new Image(),
      wheel: new Image(),
      angkot: new Image(),
      meteor: new Image(),
      truck: new Image()
    };

    function loadSavedAssets() {
      const saved = JSON.parse(localStorage.getItem('mbg_racing_assets') || '{}');
      Object.keys(assets).forEach(key => {
        if (saved[key]) {
          assets[key].src = saved[key];
          document.getElementById(`prev_${key}`).src = saved[key];
        }
      });
    }

    function uploadAsset(e, key) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          assets[key].src = evt.target.result;
          document.getElementById(`prev_${key}`).src = evt.target.result;
          const saved = JSON.parse(localStorage.getItem('mbg_racing_assets') || '{}');
          saved[key] = evt.target.result;
          localStorage.setItem('mbg_racing_assets', JSON.stringify(saved));
        };
        reader.readAsDataURL(file);
      }
    }

    function clearAssets() {
      localStorage.removeItem('mbg_racing_assets');
      Object.keys(assets).forEach(key => { assets[key].src = ''; document.getElementById(`prev_${key}`).src = ''; });
    }

    // --- JALUR EKSTREM (bukit tinggi & curam) ---
    function getTerrainHeight(x) {
      const k = canvas.height / 700;
      return canvas.height * 0.58 + (Math.sin(x * 0.0016) * 115 + Math.sin(x * 0.0043 + 1) * 52 + Math.sin(x * 0.0095 + 2) * 16) * k;
    }

    function getTerrainAngle(x) {
      const dx = 5;
      const y1 = getTerrainHeight(x - dx);
      const y2 = getTerrainHeight(x + dx);
      return Math.atan2(y2 - y1, dx * 2);
    }

    // Game State
    let distance = 0;
    let worldX = 150;
    let carSpeed = 3.5;
    let carY = 0;
    let carAngle = 0;
    let verticalVelocity = 0;

    let activeEvents = [];
    let particles = [];
    let bannerText = '';
    let bannerTimer = 0;

    function triggerGift(type) {
      const user = document.getElementById('viewerName').value || 'Penonton';
      
      if (type === 'rose') {
        bannerText = `🌹 ${user} mengirim Angkot Push!`;
        activeEvents.push({ type: 'angkot', x: worldX + 350, speed: -6 });
      } else if (type === 'meteor') {
        bannerText = `☄️ ${user} menjatuhkan Meteor Api!`;
        activeEvents.push({ type: 'meteor', x: worldX + 80, y: -80, targetY: getTerrainHeight(worldX) });
      } else if (type === 'truck') {
        bannerText = `🚚 ${user} membantu dengan Truk Sound!`;
        activeEvents.push({ type: 'truck', x: worldX - 250, speed: 7.5 });
      } else if (type === 'hero') {
        bannerText = `🦸 ${user} memanggil Luffy / Boost!`;
        carSpeed = 9.5;
        setTimeout(() => carSpeed = 3.5, 2000);
      }
      bannerTimer = 180;
    }

    function createExplosion(x, y) {
      for (let i = 0; i < 18; i++) {
        particles.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          size: Math.random() * 6 + 3,
          life: 25,
          color: Math.random() > 0.5 ? '#f97316' : '#ef4444'
        });
      }
    }

    function update() {
      worldX += carSpeed;
      distance = Math.floor(worldX);

      const targetY = getTerrainHeight(worldX);
      const targetAngle = getTerrainAngle(worldX);

      carY += (targetY - carY) * 0.3 + verticalVelocity;
      carAngle += (targetAngle - carAngle) * 0.3;
      verticalVelocity *= 0.8;

      activeEvents.forEach((ev, i) => {
        if (ev.type === 'angkot') {
          ev.x += ev.speed;
          if (Math.abs(ev.x - worldX) < 60) {
            carSpeed = -2;
            setTimeout(() => carSpeed = 3.5, 1400);
          }
        } else if (ev.type === 'meteor') {
          ev.y += 14;
          if (ev.y >= ev.targetY - 20) {
            createExplosion(120, carY - 15);
            if (Math.abs(ev.x - worldX) < 100) {
              verticalVelocity = -15;
              carSpeed = 0;
              setTimeout(() => carSpeed = 3.5, 1200);
            }
            activeEvents.splice(i, 1);
          }
        } else if (ev.type === 'truck') {
          ev.x += ev.speed;
          if (ev.x >= worldX - 60 && ev.x <= worldX) {
            carSpeed = 7.5;
            setTimeout(() => carSpeed = 3.5, 1200);
          }
        }
      });

      particles.forEach((p, i) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      });

      if (bannerTimer > 0) bannerTimer--;
    }

    // --- TEMA JALAN ---
    const THEMES = {
      sawit: { name: '🌴 Sawit (kabin & sungai)', scene: true, deco: 'palm', grass: '#4caf2a', road: '#c8a26a', soil: ['#7a4a22', '#4a2a14'], leaf: '#2f7d32' },
      hutan: { name: '🌲 Hutan Pinus', deco: 'pine', grass: '#3f8f2f', road: '#b08d57', soil: ['#6b4a2b', '#3a2616'], leaf: '#1f5e2e' },
      sawah: { name: '🌾 Sawah Desa', deco: 'rice', grass: '#8bc34a', road: '#d2b27a', soil: ['#8a5a2b', '#5d3b1c'], leaf: '#6fb02a' },
      gurun: { name: '🏜️ Gurun', deco: 'cactus', grass: '#e0b25a', road: '#f1d9a0', soil: ['#c98a3d', '#8a5524'], leaf: '#3d8b4a' },
      salju: { name: '❄️ Salju', deco: 'snow', grass: '#f1f5f9', road: '#cbd5e1', soil: ['#94a3b8', '#475569'], leaf: '#166534' }
    };
    let theme = localStorage.getItem('mbg_theme') || 'sawit';
    if (!THEMES[theme]) theme = 'sawit';
    const themeSel = document.getElementById('themeSelect');
    Object.keys(THEMES).forEach(k => themeSel.add(new Option(THEMES[k].name, k)));
    themeSel.value = theme;
    function setTheme(v) { theme = v; localStorage.setItem('mbg_theme', v); }

    const surfY = wx => getTerrainHeight(wx) + 23;
    const hash = n => { const v = Math.sin(n * 127.1) * 43758.5453; return v - Math.floor(v); };

    function drawDeco(T, sx, y, r) {
      const sc = 0.8 + r * 0.7;
      ctx.save(); ctx.translate(sx, y + 4); ctx.scale(sc, sc);
      if (T.deco === 'pine' || T.deco === 'snow') {
        ctx.fillStyle = '#5b3a1e'; ctx.fillRect(-4, -26, 8, 28);
        for (let i = 0; i < 3; i++) {
          ctx.fillStyle = T.leaf; ctx.beginPath();
          ctx.moveTo(0, -95 + i * 20); ctx.lineTo(-30 + i * 4, -30 - (2 - i) * 8 + i * 6); ctx.lineTo(30 - i * 4, -30 - (2 - i) * 8 + i * 6); ctx.fill();
          if (T.deco === 'snow') { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(0, -95 + i * 20); ctx.lineTo(-12, -70 + i * 20); ctx.lineTo(12, -70 + i * 20); ctx.fill(); }
        }
      } else if (T.deco === 'palm') {
        ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(8, -50, 0, -100); ctx.stroke();
        ctx.strokeStyle = T.leaf; ctx.lineWidth = 4;
        for (let i = 0; i < 7; i++) { const an = -Math.PI / 2 + (i - 3) * 0.55; ctx.beginPath(); ctx.moveTo(0, -100); ctx.quadraticCurveTo(Math.cos(an) * 30, -100 + Math.sin(an) * 30 - 10, Math.cos(an) * 52, -100 + Math.sin(an) * 40 + 22); ctx.stroke(); }
        ctx.fillStyle = '#c2410c'; ctx.beginPath(); ctx.arc(-4, -96, 4, 0, 7); ctx.arc(5, -94, 4, 0, 7); ctx.fill();
      } else if (T.deco === 'rice') {
        ctx.strokeStyle = T.leaf; ctx.lineWidth = 3;
        for (let i = -3; i <= 3; i++) { ctx.beginPath(); ctx.moveTo(i * 5, 0); ctx.lineTo(i * 6, -22 - (i % 2) * 6); ctx.stroke(); }
      } else {
        ctx.fillStyle = T.leaf; ctx.fillRect(-5, -50, 10, 52); ctx.fillRect(-18, -34, 7, 5); ctx.fillRect(-18, -42, 5, 13); ctx.fillRect(11, -28, 7, 5); ctx.fillRect(13, -38, 5, 15);
      }
      ctx.restore();
    }

    function drawHut(sx, y) {
      ctx.fillStyle = '#7c5a36'; ctx.fillRect(sx - 22, y - 30, 44, 30);
      ctx.fillStyle = '#d6b76b'; ctx.beginPath(); ctx.moveTo(sx - 30, y - 30); ctx.lineTo(sx, y - 56); ctx.lineTo(sx + 30, y - 30); ctx.fill();
      ctx.fillStyle = '#2a1a0c'; ctx.fillRect(sx - 5, y - 20, 10, 20);
    }

    // Isi area di bawah gambar dengan batuan (bukan warna polos) memakai bagian bawah gambar yang dipantulkan
    function stoneFill(img, sc, u, sw, sx, yTop) {
      const nh = img.naturalHeight, nw = img.naturalWidth, sh = Math.floor(nh * 0.12);
      if (!img._fill || img._fillSrc !== img.src) {
        const cv = document.createElement('canvas'); cv.width = nw; cv.height = sh * 2;
        const g = cv.getContext('2d');
        g.save(); g.translate(0, sh); g.scale(1, -1); g.drawImage(img, 0, nh - sh, nw, sh, 0, 0, nw, sh); g.restore();
        g.drawImage(img, 0, nh - sh, nw, sh, 0, sh, nw, sh);
        img._fill = cv; img._fillSrc = img.src;
      }
      const th = sh * 2 * sc;
      for (let yy = yTop - 1; yy < canvas.height; yy += th) ctx.drawImage(img._fill, u, 0, sw, sh * 2, sx, yy, sw * sc + 0.5, th + 1);
    }


    // --- GAMBAR TEMA (sudah tertanam) ---

    const SCENE_ANCHOR = { sawit: [0.4815, 1.0740] }; // [posisi garis jalan, skala tinggi]

    function warpLayer(img, sc, anchor, par, fill) {
      const W = canvas.width, H = canvas.height, off = worldX - 120, nh = img.naturalHeight, nw = img.naturalWidth, lw = nw * sc, hh = nh * sc;
      for (let sx = 0; sx < W + 3; sx += 3) {
        const y = surfY(sx + off) - anchor * hh;
        let u = ((((sx + worldX * par) % lw) + lw) % lw) / sc, sw = 3 / sc;
        if (u + sw > nw) sw = nw - u;
        if (fill && y + hh < H) stoneFill(img, sc, u, sw, sx, y + hh);
        ctx.drawImage(img, u, 0, sw, nh, sx, y, sw * sc + 0.5, hh);
      }
    }

    function drawRoadRibbon() {
      const W = canvas.width, off = worldX - 120;
      const path = dy => { ctx.beginPath(); for (let sx = 0; sx <= W + 4; sx += 4) { const y = surfY(sx + off) + dy; sx ? ctx.lineTo(sx, y) : ctx.moveTo(sx, y); } };
      ctx.lineJoin = 'round';
      path(5); ctx.strokeStyle = '#d1d5db'; ctx.lineWidth = 17; ctx.stroke();
      path(5); ctx.strokeStyle = '#4b5563'; ctx.lineWidth = 12; ctx.stroke();
    }

    function drawGround() {
      const T = THEMES[theme], W = canvas.width, H = canvas.height, off = worldX - 120, img = assets.bgForeground;

      // Tema bergambar: pemandangan + tanah dibengkokkan mengikuti bukit, jalan aspal di atasnya
      const SI = sceneImgs[theme];
      if (T.scene && SI && SI.naturalHeight) {
        warpLayer(SI, H * SCENE_ANCHOR[theme][1] / SI.naturalHeight, SCENE_ANCHOR[theme][0], 1.0, true);
        drawRoadRibbon();
        return;
      }

      // Mode gambar: gambar layer 2 (versi DATAR) dibengkokkan mengikuti jalur
      if (T.img && img.complete && img.naturalHeight) {
        const lh = H * 0.7, sc = lh / img.naturalHeight, lw = img.naturalWidth * sc, c0 = 0.62996;
        for (let sx = 0; sx < W + 3; sx += 3) {
          const y = surfY(sx + off) - c0 * lh;
          let u = ((((sx + worldX) % lw) + lw) % lw) / sc, sw = 3 / sc;
          if (u + sw > img.naturalWidth) sw = img.naturalWidth - u;
          if (y + lh < H) stoneFill(img, sc, u, sw, sx, y + lh);
          ctx.drawImage(img, u, 0, sw, img.naturalHeight, sx, y, sw * sc + 0.5, lh);
        }
        return;
      }

      // Mode gambar-prosedural: pohon/rumah dulu, lalu tanah di depannya
      const c0 = Math.floor((off - 80) / 90), c1 = Math.floor((off + W + 80) / 90);
      for (let i = c0; i <= c1; i++) {
        const r = hash(i + 7), wx = i * 90 + r * 50, sx = wx - off;
        if (r > 0.9) drawHut(sx, surfY(wx)); else if (r > 0.25) drawDeco(T, sx, surfY(wx), hash(i * 3.1));
      }
      const g = ctx.createLinearGradient(0, H * 0.3, 0, H);
      g.addColorStop(0, T.soil[0]); g.addColorStop(1, T.soil[1]);
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, H);
      for (let sx = 0; sx <= W + 4; sx += 4) ctx.lineTo(sx, surfY(sx + off));
      ctx.lineTo(W + 4, H); ctx.fill();

      // batu-batu di dalam tanah
      const s0 = Math.floor((off - 20) / 38), s1 = Math.floor((off + W + 20) / 38);
      for (let i = s0; i <= s1; i++) {
        const wx = i * 38 + hash(i) * 30, sy = surfY(wx) + 26 + hash(i + 11) * 150;
        if (sy < H) { ctx.fillStyle = hash(i + 5) > 0.5 ? 'rgba(0,0,0,0.22)' : 'rgba(255,255,255,0.18)'; ctx.beginPath(); ctx.ellipse(wx - off, sy, 4 + hash(i + 2) * 6, 3 + hash(i + 4) * 4, 0, 0, 7); ctx.fill(); }
      }

      // rumput + jalan tanah
      ctx.lineJoin = 'round';
      ctx.beginPath(); for (let sx = 0; sx <= W + 4; sx += 4) { const y = surfY(sx + off); sx ? ctx.lineTo(sx, y) : ctx.moveTo(sx, y); }
      ctx.strokeStyle = T.grass; ctx.lineWidth = 16; ctx.stroke();
      ctx.beginPath(); for (let sx = 0; sx <= W + 4; sx += 4) { const y = surfY(sx + off) + 3; sx ? ctx.lineTo(sx, y) : ctx.moveTo(sx, y); }
      ctx.strokeStyle = T.road; ctx.lineWidth = 7; ctx.stroke();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // --- LAYER 1: Gunung & Langit (Paling Belakang - Fullscreen) ---
      if (assets.bgFar.complete && assets.bgFar.src) {
        const bgFarWidth = canvas.width;
        const bgFarOffset = -(worldX * 0.1) % bgFarWidth;
        ctx.drawImage(assets.bgFar, bgFarOffset, 0, bgFarWidth, canvas.height);
        ctx.drawImage(assets.bgFar, bgFarOffset + bgFarWidth, 0, bgFarWidth, canvas.height);
      } else {
        const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        skyGrad.addColorStop(0, '#0284c7');
        skyGrad.addColorStop(0.5, '#38bdf8');
        skyGrad.addColorStop(1, '#bae6fd');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#1e3a8a';
        ctx.beginPath();
        ctx.moveTo(-50, canvas.height - 100);
        ctx.lineTo(canvas.width * 0.5, canvas.height - 280);
        ctx.lineTo(canvas.width + 50, canvas.height - 100);
        ctx.fill();
      }

      drawGround();

      // Top Meter Bar
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.fillRect(15, 15, canvas.width - 30, 36);
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(15, 15, canvas.width - 30, 36);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`🏁 ${distance} m / 30.000 m`, canvas.width / 2, 38);
      ctx.textAlign = 'left';

      // Render Mobil & Roda (Posisi Y diturunkan agar pas menapak di atas jalan gambar)
      const screenCarX = 120;
      ctx.save();
      // Penyesuaian offset vertikal agar ban pas di garis jalan gabungan
      ctx.translate(screenCarX, carY - 6);
      ctx.rotate(carAngle);

      if (assets.carBody.complete && assets.carBody.src) {
        ctx.drawImage(assets.carBody, -55, -30, 110, 55);
      } else {
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(-55, -28, 110, 50);
        ctx.fillStyle = '#1e3a8a';
        ctx.font = 'bold 8px sans-serif';
        ctx.fillText('SATUAN PELAYANAN', -48, -10);
        ctx.fillText('PEMENUHAN GIZI', -48, 2);
      }

      const wheelSpin = worldX * 0.12;
      drawWheel(-35, 16, 13, wheelSpin);
      drawWheel(35, 16, 13, wheelSpin);
      ctx.restore();

      // Render Gift Events
      activeEvents.forEach(ev => {
        const screenEvX = ev.x - worldX + 120;
        const evY = getTerrainHeight(ev.x);

        if (ev.type === 'angkot') {
          if (assets.angkot.complete && assets.angkot.src) {
            ctx.drawImage(assets.angkot, screenEvX - 40, evY - 40, 80, 40);
          } else {
            ctx.fillStyle = '#eab308';
            ctx.fillRect(screenEvX - 35, evY - 35, 70, 35);
          }
        } else if (ev.type === 'meteor') {
          if (assets.meteor.complete && assets.meteor.src) {
            ctx.drawImage(assets.meteor, screenEvX - 30, ev.y - 30, 60, 60);
          } else {
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(screenEvX, ev.y, 20, 0, Math.PI * 2);
            ctx.fill();
          }
        } else if (ev.type === 'truck') {
          if (assets.truck.complete && assets.truck.src) {
            ctx.drawImage(assets.truck, screenEvX - 45, evY - 45, 90, 45);
          } else {
            ctx.fillStyle = '#0284c7';
            ctx.fillRect(screenEvX - 40, evY - 40, 80, 40);
          }
        }
      });

      // Particles Explosion
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // Banner Gift TikTok
      if (bannerTimer > 0) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
        ctx.fillRect(15, 60, canvas.width - 30, 36);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(15, 60, canvas.width - 30, 36);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText(bannerText, 25, 83);
      }
    }

    function drawWheel(x, y, radius, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      if (assets.wheel.complete && assets.wheel.src) {
        ctx.drawImage(assets.wheel, -radius, -radius, radius * 2, radius * 2);
      } else {
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }
      ctx.restore();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    document.getElementById('openAssetModal').onclick = () => document.getElementById('modalOverlay').classList.add('active');
    document.getElementById('closeAssetModal').onclick = () => document.getElementById('modalOverlay').classList.remove('active');

    loadSavedAssets();
    loop();
  </script>
