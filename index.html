<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBG Racing - Gran Max Perkebunan Interactive Live</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-green: #22c55e;
      --accent-blue: #3b82f6;
      --accent-pink: #ec4899;
      --accent-red: #ef4444;
      --text-light: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      overflow: hidden;
    }

    .main-container {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 12px;
      width: 100%;
      max-width: 1350px;
      aspect-ratio: 16 / 9;
      background: var(--card-bg);
      padding: 12px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      border: 1px solid #334155;
    }

    .game-section {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #0284c7;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #334155;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100%;
      overflow-y: auto;
    }

    .card {
      background: #0f172a;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #334155;
    }

    .card h3 {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 8px;
    }

    .input-group label {
      font-size: 0.75rem;
      color: #cbd5e1;
    }

    input[type="text"] {
      background: #1e293b;
      border: 1px solid #475569;
      padding: 8px;
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
    }

    .btn {
      background: var(--accent-blue);
      color: white;
      border: none;
      padding: 8px 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-green { background: var(--accent-green); }
    .btn-pink { background: var(--accent-pink); }
    .btn-red { background: var(--accent-red); }
    .btn-orange { background: #f97316; }

    .gift-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center;
      z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal {
      background: var(--card-bg); width: 90%; max-width: 600px;
      max-height: 85vh; overflow-y: auto; border-radius: 12px; padding: 18px;
    }
    .asset-uploader-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .asset-item { background: #0f172a; padding: 8px; border-radius: 6px; border: 1px dashed #475569; }
    .asset-item label { font-size: 0.75rem; color: #cbd5e1; display: block; margin-bottom: 4px; }
    .preview-box { width: 100%; height: 50px; background: #1e293b; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .preview-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="game-section">
      <canvas id="gameCanvas"></canvas>
    </div>

    <div class="sidebar">
      <div class="card">
        <h3>Pengaturan Gambar Game</h3>
        <button class="btn btn-green" id="openAssetModal" style="width: 100%;">
          📁 Upload Aset Gambar Kustom
        </button>
      </div>

      <div class="card">
        <h3>Simulasi Gift TikTok</h3>
        <div class="input-group">
          <label>Nama Viewer</label>
          <input type="text" id="viewerName" value="Penonton_Aktif" placeholder="Nama penonton...">
        </div>

        <div class="gift-grid">
          <button class="btn btn-pink" onclick="triggerGift('rose')">
            🌹 Angkot Mendorong
          </button>
          <button class="btn btn-red" onclick="triggerGift('meteor')">
            ☄️ Hantaman Meteor
          </button>
          <button class="btn btn-orange" onclick="triggerGift('truck')">
            🚚 Truk Sound Horeg
          </button>
          <button class="btn btn-blue" onclick="triggerGift('hero')">
            🦸 Bantuan Karakter
          </button>
        </div>
      </div>

      <div class="card">
        <h3>Jarak Tempuh</h3>
        <p id="distMeter" style="font-size: 1.1rem; font-weight: bold; color: #38bdf8;">0 m / 30.000 m</p>
      </div>
    </div>
  </div>

  <!-- Modal Asset Manager -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 style="font-size: 1.1rem; margin-bottom: 12px;">Upload Aset Gambar Kustom</h2>
      <div class="asset-uploader-grid">
        <div class="asset-item"><label>1. Bodi Gran Max (PNG)</label><input type="file" accept="image/*" onchange="uploadAsset(event, 'carBody')"><div class="preview-box"><img id="prev_carBody"></div></div>
        <div class="asset-item"><label>2. Roda Mobil (PNG)</label><input type="file" accept="image/*" onchange="uploadAsset(event, 'wheel')"><div class="preview-box"><img id="prev_wheel"></div></div>
        <div class="asset-item"><label>3. Latar Perkebunan</label><input type="file" accept="image/*" onchange="uploadAsset(event, 'background')"><div class="preview-box"><img id="prev_background"></div></div>
        <div class="asset-item"><label>4. Mobil Angkot/Pendorong</label><input type="file" accept="image/*" onchange="uploadAsset(event, 'angkot')"><div class="preview-box"><img id="prev_angkot"></div></div>
        <div class="asset-item"><label>5. Meteor Api (PNG)</label><input type="file" accept="image/*" onchange="uploadAsset(event, 'meteor')"><div class="preview-box"><img id="prev_meteor"></div></div>
        <div class="asset-item"><label>6. Truk Sound/Kopdes</label><input type="file" accept="image/*" onchange="uploadAsset(event, 'truck')"><div class="preview-box"><img id="prev_truck"></div></div>
      </div>
      <div style="margin-top: 15px; display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn btn-red" onclick="clearAssets()">Reset</button>
        <button class="btn btn-green" id="closeAssetModal">Selesai</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Assets Loader
    const assets = {
      carBody: new Image(), wheel: new Image(), background: new Image(),
      angkot: new Image(), meteor: new Image(), truck: new Image()
    };

    function loadSavedAssets() {
      const saved = JSON.parse(localStorage.getItem('mbg_racing_assets') || '{}');
      Object.keys(assets).forEach(key => {
        if (saved[key]) {
          assets[key].src = saved[key];
          document.getElementById(`prev_${key}`).src = saved[key];
        }
      });
    }

    function uploadAsset(e, key) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          assets[key].src = evt.target.result;
          document.getElementById(`prev_${key}`).src = evt.target.result;
          const saved = JSON.parse(localStorage.getItem('mbg_racing_assets') || '{}');
          saved[key] = evt.target.result;
          localStorage.setItem('mbg_racing_assets', JSON.stringify(saved));
        };
        reader.readAsDataURL(file);
      }
    }

    function clearAssets() {
      localStorage.removeItem('mbg_racing_assets');
      Object.keys(assets).forEach(key => { assets[key].src = ''; document.getElementById(`prev_${key}`).src = ''; });
    }

    // --- MATH & TERRAIN GENERATOR (Jalanan Naik Turun) ---
    function getTerrainHeight(x) {
      // Kombinasi fungsi sinus untuk menghasilkan gelombang perbukitan
      return Math.sin(x * 0.003) * 60 + Math.sin(x * 0.008) * 30 + (canvas.height - 130);
    }

    function getTerrainAngle(x) {
      const dx = 5;
      const y1 = getTerrainHeight(x - dx);
      const y2 = getTerrainHeight(x + dx);
      return Math.atan2(y2 - y1, dx * 2);
    }

    // Game Physics State
    let distance = 0;
    let worldX = 200;
    let carSpeed = 3;
    let carY = 0;
    let carAngle = 0;
    let verticalVelocity = 0;

    let activeEvents = [];
    let bannerText = '';
    let bannerTimer = 0;

    function triggerGift(type) {
      const user = document.getElementById('viewerName').value || 'Penonton';
      
      if (type === 'rose') {
        bannerText = `🌹 ${user} mengirim Angkot Mendorong Mundur!`;
        activeEvents.push({ type: 'angkot', x: worldX + 500, speed: -6 });
      } else if (type === 'meteor') {
        bannerText = `☄️ ${user} menjatuhkan Meteor Api!`;
        activeEvents.push({ type: 'meteor', x: worldX + 100, y: -100, targetY: getTerrainHeight(worldX) });
      } else if (type === 'truck') {
        bannerText = `🚚 ${user} membantu dengan Truk Sound Horeg!`;
        activeEvents.push({ type: 'truck', x: worldX - 300, speed: 7 });
      } else if (type === 'hero') {
        bannerText = `🦸 ${user} mengirim Bantuan Karakter!`;
        carSpeed = 10;
        setTimeout(() => carSpeed = 3, 2000);
      }
      bannerTimer = 180;
    }

    function update() {
      // Update Posisi Mobil
      worldX += carSpeed;
      distance = Math.floor(worldX);
      document.getElementById('distMeter').innerText = `${distance} m / 30.000 m`;

      // Kalkulasi Ketinggian & Sudut Jalanan di Bawah Mobil
      const targetY = getTerrainHeight(worldX);
      const targetAngle = getTerrainAngle(worldX);

      // Dampak Suspensi / Gravitasi Mobil
      carY += (targetY - carY) * 0.2 + verticalVelocity;
      carAngle += (targetAngle - carAngle) * 0.2;
      verticalVelocity *= 0.8;

      // Event Logic
      activeEvents.forEach((ev, i) => {
        if (ev.type === 'angkot') {
          ev.x += ev.speed;
          if (Math.abs(ev.x - worldX) < 80) {
            carSpeed = -2; // Tabrakan terdorong mundur
            setTimeout(() => carSpeed = 3, 1500);
          }
        } else if (ev.type === 'meteor') {
          ev.y += 12;
          if (ev.y >= ev.targetY - 20) {
            if (Math.abs(ev.x - worldX) < 120) {
              verticalVelocity = -15; // Terpental ke atas saat Kena Meteor
              carSpeed = 0;
              setTimeout(() => carSpeed = 3, 1000);
            }
            activeEvents.splice(i, 1);
          }
        } else if (ev.type === 'truck') {
          ev.x += ev.speed;
          if (ev.x >= worldX - 80 && ev.x <= worldX) {
            carSpeed = 7; // Pendorong dari belakang
            setTimeout(() => carSpeed = 3, 1200);
          }
        }
      });

      if (bannerTimer > 0) bannerTimer--;
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Render Background (Perkebunan)
      if (assets.background.complete && assets.background.src) {
        const bgOffset = -(worldX * 0.2) % canvas.width;
        ctx.drawImage(assets.background, bgOffset, 0, canvas.width, canvas.height);
        ctx.drawImage(assets.background, bgOffset + canvas.width, 0, canvas.width, canvas.height);
      }

      // 2. Render Jalanan Bergelombang (Perbukitan)
      ctx.beginPath();
      ctx.moveTo(0, canvas.height);
      for (let screenX = 0; screenX <= canvas.width; screenX += 10) {
        const actualWorldX = worldX - 200 + screenX;
        const h = getTerrainHeight(actualWorldX);
        ctx.lineTo(screenX, h);
      }
      ctx.lineTo(canvas.width, canvas.height);
      ctx.fillStyle = '#15803d'; // Warna Rumput Perkebunan
      ctx.fill();
      ctx.strokeStyle = '#22c55e';
      ctx.lineWidth = 6;
      ctx.stroke();

      // 3. Render Gran Max Van & Roda
      const screenCarX = 200;
      ctx.save();
      ctx.translate(screenCarX, carY - 25);
      ctx.rotate(carAngle);

      if (assets.carBody.complete && assets.carBody.src) {
        ctx.drawImage(assets.carBody, -70, -40, 140, 70);
      } else {
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(-70, -35, 140, 60);
        ctx.fillStyle = '#1e3a8a';
        ctx.font = 'bold 11px sans-serif';
        ctx.fillText('SATUAN GIZI', -40, -10);
      }

      // Render Roda Berputar
      const wheelSpin = worldX * 0.1;
      drawWheel(-45, 20, 16, wheelSpin);
      drawWheel(45, 20, 16, wheelSpin);
      ctx.restore();

      // 4. Render Active Events
      activeEvents.forEach(ev => {
        const screenEvX = ev.x - worldX + 200;
        const evY = getTerrainHeight(ev.x);

        if (ev.type === 'angkot') {
          if (assets.angkot.complete && assets.angkot.src) {
            ctx.drawImage(assets.angkot, screenEvX - 50, evY - 50, 100, 50);
          } else {
            ctx.fillStyle = '#eab308';
            ctx.fillRect(screenEvX - 40, evY - 40, 80, 40);
          }
        } else if (ev.type === 'meteor') {
          if (assets.meteor.complete && assets.meteor.src) {
            ctx.drawImage(assets.meteor, screenEvX - 30, ev.y - 30, 60, 60);
          } else {
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(screenEvX, ev.y, 25, 0, Math.PI * 2);
            ctx.fill();
          }
        } else if (ev.type === 'truck') {
          if (assets.truck.complete && assets.truck.src) {
            ctx.drawImage(assets.truck, screenEvX - 60, evY - 60, 120, 60);
          } else {
            ctx.fillStyle = '#64748b';
            ctx.fillRect(screenEvX - 50, evY - 50, 100, 50);
          }
        }
      });

      // 5. Render Banner Notifikasi Live Gift
      if (bannerTimer > 0) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
        ctx.fillRect(20, 20, 380, 42);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.strokeRect(20, 20, 380, 42);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText(bannerText, 32, 46);
      }
    }

    function drawWheel(x, y, radius, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      if (assets.wheel.complete && assets.wheel.src) {
        ctx.drawImage(assets.wheel, -radius, -radius, radius * 2, radius * 2);
      } else {
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 3;
        ctx.stroke();
      }
      ctx.restore();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    document.getElementById('openAssetModal').onclick = () => document.getElementById('modalOverlay').classList.add('active');
    document.getElementById('closeAssetModal').onclick = () => document.getElementById('modalOverlay').classList.remove('active');

    loadSavedAssets();
    loop();
  </script>
</body>
</html>
