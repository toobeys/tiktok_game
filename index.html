<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gran Max Perkebunan - TikTok Live Interactive (Landscape 16:9)</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-green: #22c55e;
      --accent-blue: #3b82f6;
      --accent-pink: #ec4899;
      --text-light: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
      overflow-x: hidden;
    }

    /* Container Utama Landscape 16:9 Layout */
    .main-container {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 15px;
      width: 100%;
      max-width: 1400px;
      aspect-ratio: 16 / 9;
      background: var(--card-bg);
      padding: 15px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      border: 1fr solid #334155;
    }

    /* Area Game Canvas */
    .game-section {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #334155;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Dashboard & Control Sidebar */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100%;
      overflow-y: auto;
      padding-right: 4px;
    }

    .card {
      background: #0f172a;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #334155;
    }

    .card h3 {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }

    .input-group label {
      font-size: 0.8rem;
      color: #cbd5e1;
    }

    input[type="text"] {
      background: #1e293b;
      border: 1px solid #475569;
      padding: 8px 12px;
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
    }

    .btn {
      background: var(--accent-blue);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .btn-green { background: var(--accent-green); }
    .btn-pink { background: var(--accent-pink); }
    .btn-purple { background: #8b5cf6; }
    .btn-orange { background: #f97316; }

    .gift-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* Modal Pengaturan Aset Gambar */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: var(--card-bg);
      width: 90%;
      max-width: 650px;
      max-height: 85vh;
      overflow-y: auto;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #475569;
    }

    .modal h2 {
      margin-bottom: 15px;
      font-size: 1.2rem;
      color: var(--text-light);
    }

    .asset-uploader-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .asset-item {
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      border: 1px dashed #475569;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .asset-item label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    .asset-item input[type="file"] {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .preview-box {
      width: 100%;
      height: 60px;
      background: #1e293b;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .preview-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .modal-actions {
      margin-top: 15px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <!-- Area Panggung Utama Game (Landscape 16:9) -->
    <div class="game-section">
      <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Sidebar Dashboard Kontrol -->
    <div class="sidebar">
      <div class="card">
        <h3>Kelola Gambar Game</h3>
        <button class="btn btn-green" id="openAssetModal" style="width: 100%;">
          📁 Upload Aset Gambar Kustom
        </button>
      </div>

      <div class="card">
        <h3>Simulasi Gift TikTok</h3>
        <div class="input-group">
          <label for="viewerName">Nama Viewer TikTok</label>
          <input type="text" id="viewerName" value="Sultan_Cirebon" placeholder="Ketik nama penonton...">
        </div>

        <div class="gift-grid">
          <button class="btn btn-pink" onclick="triggerGift('rose')">
            🌹 Penghalang
          </button>
          <button class="btn btn-orange" onclick="triggerGift('missile')">
            🚀 Rudal
          </button>
          <button class="btn btn-blue" onclick="triggerGift('superman')">
            🦸 Superman
          </button>
          <button class="btn btn-purple" onclick="triggerGift('gem')">
            💎 Permata
          </button>
        </div>
      </div>

      <div class="card">
        <h3>Status Game</h3>
        <p style="font-size: 0.85rem; color: #94a3b8; line-height: 1.4;">
          Latar: <strong>Perkebunan</strong><br>
          Kendaraan: <strong>Truk Van Gran Max Gizi</strong><br>
          Mode Tampilan: <strong>Landscape 16:9</strong>
        </p>
      </div>
    </div>
  </div>

  <!-- Modal Manager Aset Gambar -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2>Upload Aset Gambar Kustom</h2>
      <div class="asset-uploader-grid">
        
        <div class="asset-item">
          <label>1. Bodi Gran Max (PNG Transparan)</label>
          <input type="file" accept="image/*" onchange="uploadAsset(event, 'carBody')">
          <div class="preview-box"><img id="prev_carBody"></div>
        </div>

        <div class="asset-item">
          <label>2. Roda Mobil (PNG Transparan)</label>
          <input type="file" accept="image/*" onchange="uploadAsset(event, 'wheel')">
          <div class="preview-box"><img id="prev_wheel"></div>
        </div>

        <div class="asset-item">
          <label>3. Latar Perkebunan (PNG/JPG)</label>
          <input type="file" accept="image/*" onchange="uploadAsset(event, 'background')">
          <div class="preview-box"><img id="prev_background"></div>
        </div>

        <div class="asset-item">
          <label>4. Superman (PNG Transparan)</label>
          <input type="file" accept="image/*" onchange="uploadAsset(event, 'superman')">
          <div class="preview-box"><img id="prev_superman"></div>
        </div>

        <div class="asset-item">
          <label>5. Rudal / Roket (PNG Transparan)</label>
          <input type="file" accept="image/*" onchange="uploadAsset(event, 'missile')">
          <div class="preview-box"><img id="prev_missile"></div>
        </div>

        <div class="asset-item">
          <label>6. Penghalang Jalan (PNG Transparan)</label>
          <input type="file" accept="image/*" onchange="uploadAsset(event, 'obstacle')">
          <div class="preview-box"><img id="prev_obstacle"></div>
        </div>

      </div>

      <div class="modal-actions">
        <button class="btn btn-purple" onclick="clearAssets()">Reset Aset</button>
        <button class="btn btn-green" id="closeAssetModal">Selesai & Simpan</button>
      </div>
    </div>
  </div>

  <script>
    // --- CANVAS ENGINE SETUP ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- ASSETS STORAGE & MANAGEMENT ---
    const assets = {
      carBody: new Image(),
      wheel: new Image(),
      background: new Image(),
      superman: new Image(),
      missile: new Image(),
      obstacle: new Image()
    };

    function loadSavedAssets() {
      const saved = JSON.parse(localStorage.getItem('granmax_game_assets') || '{}');
      Object.keys(assets).forEach(key => {
        if (saved[key]) {
          assets[key].src = saved[key];
          document.getElementById(`prev_${key}`).src = saved[key];
        }
      });
    }

    function uploadAsset(e, key) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const dataUrl = evt.target.result;
          assets[key].src = dataUrl;
          document.getElementById(`prev_${key}`).src = dataUrl;

          // Save to LocalStorage
          const saved = JSON.parse(localStorage.getItem('granmax_game_assets') || '{}');
          saved[key] = dataUrl;
          localStorage.setItem('granmax_game_assets', JSON.stringify(saved));
        };
        reader.readAsDataURL(file);
      }
    }

    function clearAssets() {
      localStorage.removeItem('granmax_game_assets');
      Object.keys(assets).forEach(key => {
        assets[key].src = '';
        document.getElementById(`prev_${key}`).src = '';
      });
    }

    // --- GAME STATE ---
    let bgX = 0;
    const car = {
      x: 150,
      y: 0,
      width: 170,
      height: 85,
      speed: 4,
      wheelAngle: 0,
      bounceY: 0
    };

    let activeEvents = [];
    let notificationText = '';
    let notificationTimer = 0;

    // --- PROCEDURAL AUDIO GENERATOR (Web Audio API) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'boost') {
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      } else if (type === 'explode') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      }
    }

    // --- GIFT INTERACTION ---
    function triggerGift(type) {
      const username = document.getElementById('viewerName').value || 'Viewer';

      if (type === 'rose') {
        notificationText = `🌹 ${username} mengirim Penghalang!`;
        activeEvents.push({ type: 'obstacle', x: canvas.width + 50, y: canvas.height - 130 });
      } else if (type === 'missile') {
        notificationText = `🚀 ${username} meluncurkan Rudal!`;
        playSound('explode');
        activeEvents.push({ type: 'missile', x: canvas.width + 100, y: canvas.height - 180, targetX: car.x + 50 });
      } else if (type === 'superman') {
        notificationText = `🦸 ${username} memanggil Superman!`;
        playSound('boost');
        activeEvents.push({ type: 'superman', x: -100, y: canvas.height - 180 });
      } else if (type === 'gem') {
        notificationText = `💎 ${username} memberi Hujan Permata!`;
        for (let i = 0; i < 5; i++) {
          activeEvents.push({ type: 'gem', x: canvas.width + (i * 40), y: canvas.height - 160 - (Math.random() * 50) });
        }
      }
      notificationTimer = 180;
    }

    // --- MAIN GAME LOOP ---
    function update() {
      // Background Scrolling
      bgX -= car.speed;
      if (bgX <= -canvas.width) bgX = 0;

      // Car Bounce & Wheel Spin
      car.wheelAngle += car.speed * 0.05;
      car.bounceY = Math.sin(Date.now() * 0.01) * 2;
      car.y = canvas.height - 145 + car.bounceY;

      // Event Updates
      activeEvents.forEach((item, index) => {
        if (item.type === 'obstacle') {
          item.x -= car.speed;
        } else if (item.type === 'missile') {
          item.x -= car.speed + 6;
          if (item.x <= car.x + 40) {
            activeEvents.splice(index, 1);
            car.speed = 1; // Perlambat karena kena ledakan
            setTimeout(() => car.speed = 4, 1500);
          }
        } else if (item.type === 'superman') {
          item.x += 8;
          if (item.x >= car.x - 40) {
            car.speed = 9; // Dorong cepat
            setTimeout(() => car.speed = 4, 1200);
          }
        } else if (item.type === 'gem') {
          item.x -= car.speed;
        }
      });

      if (notificationTimer > 0) notificationTimer--;
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Render Background (Perkebunan / Defaut Gradient)
      if (assets.background.complete && assets.background.src) {
        ctx.drawImage(assets.background, bgX, 0, canvas.width, canvas.height);
        ctx.drawImage(assets.background, bgX + canvas.width, 0, canvas.width, canvas.height);
      } else {
        // Fallback perkebunan latar hijau
        const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        skyGradient.addColorStop(0, '#0284c7');
        skyGradient.addColorStop(0.7, '#38bdf8');
        skyGradient.addColorStop(1, '#15803d');
        ctx.fillStyle = skyGradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // 2. Render Jalan / Landasan Perkebunan
      ctx.fillStyle = '#166534';
      ctx.fillRect(0, canvas.height - 60, canvas.width, 60);
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(0, canvas.height - 60, canvas.width, 6);

      // 3. Render Gran Max Van & Roda
      const groundY = car.y;
      if (assets.carBody.complete && assets.carBody.src) {
        ctx.drawImage(assets.carBody, car.x, groundY, car.width, car.height);
      } else {
        // Fallback gambar van
        ctx.fillStyle = '#cbd5e1';
        ctx.fillRect(car.x, groundY, car.width, car.height - 15);
        ctx.fillStyle = '#1e3a8a';
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText('SATUAN GIZI', car.x + 20, groundY + 30);
      }

      // Render Roda Berputar
      drawWheel(car.x + 35, groundY + car.height - 12, 18, car.wheelAngle);
      drawWheel(car.x + car.width - 35, groundY + car.height - 12, 18, car.wheelAngle);

      // 4. Render Active Gift Events
      activeEvents.forEach(item => {
        if (item.type === 'obstacle') {
          if (assets.obstacle.complete && assets.obstacle.src) {
            ctx.drawImage(assets.obstacle, item.x, item.y, 50, 50);
          } else {
            ctx.fillStyle = '#b45309';
            ctx.fillRect(item.x, item.y, 40, 40);
          }
        } else if (item.type === 'missile') {
          if (assets.missile.complete && assets.missile.src) {
            ctx.drawImage(assets.missile, item.x, item.y, 60, 30);
          } else {
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(item.x, item.y, 40, 15);
          }
        } else if (item.type === 'superman') {
          if (assets.superman.complete && assets.superman.src) {
            ctx.drawImage(assets.superman, item.x, item.y, 80, 50);
          } else {
            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(item.x, item.y, 50, 30);
          }
        } else if (item.type === 'gem') {
          ctx.fillStyle = '#06b6d4';
          ctx.beginPath();
          ctx.arc(item.x, item.y, 10, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // 5. Render Banner Notifikasi TikTok Live
      if (notificationTimer > 0) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(20, 20, 360, 45);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.strokeRect(20, 20, 360, 45);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 15px sans-serif';
        ctx.fillText(notificationText, 35, 48);
      }
    }

    function drawWheel(x, y, radius, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);

      if (assets.wheel.complete && assets.wheel.src) {
        ctx.drawImage(assets.wheel, -radius, -radius, radius * 2, radius * 2);
      } else {
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 3;
        ctx.stroke();
      }
      ctx.restore();
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    // Modal Listeners
    document.getElementById('openAssetModal').addEventListener('click', () => {
      document.getElementById('modalOverlay').classList.add('active');
    });

    document.getElementById('closeAssetModal').addEventListener('click', () => {
      document.getElementById('modalOverlay').classList.remove('active');
    });

    // Init Game
    loadSavedAssets();
    gameLoop();
  </script>
</body>
</html>
