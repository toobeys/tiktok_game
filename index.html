<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBG Racing - 3 Layer Parallax Sawit</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-green: #22c55e;
      --accent-blue: #3b82f6;
      --accent-pink: #ec4899;
      --accent-red: #ef4444;
      --text-light: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #020617;
      color: var(--text-light);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    .mobile-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 450px;
      height: 92vh;
      max-height: 900px;
      background: var(--card-bg);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      border: 2px solid #334155;
    }

    .game-section {
      position: relative;
      width: 100%;
      flex: 1;
      background-color: #0284c7;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .controls-section {
      background: #0f172a;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 2px solid #334155;
    }

    .input-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .input-group label {
      font-size: 0.75rem;
      color: #94a3b8;
      white-space: nowrap;
    }

    input[type="text"] {
      flex: 1;
      background: #1e293b;
      border: 1px solid #475569;
      padding: 6px 10px;
      border-radius: 6px;
      color: #fff;
      font-size: 0.8rem;
    }

    .btn {
      background: var(--accent-blue);
      color: white;
      border: none;
      padding: 8px 10px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-green { background: var(--accent-green); }
    .btn-pink { background: var(--accent-pink); }
    .btn-red { background: var(--accent-red); }
    .btn-orange { background: #f97316; }

    .gift-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center;
      z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal {
      background: var(--card-bg); width: 90%; max-width: 400px;
      max-height: 85vh; overflow-y: auto; border-radius: 12px; padding: 16px;
    }
    .asset-uploader-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .asset-item { background: #0f172a; padding: 8px; border-radius: 6px; border: 1px dashed #475569; }
    .asset-item label { font-size: 0.75rem; color: #cbd5e1; display: block; margin-bottom: 4px; }
    .preview-box { width: 100%; height: 45px; background: #1e293b; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .preview-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
  </style>
</head>
<body>

  <div class="mobile-container">
    <div class="game-section">
      <canvas id="gameCanvas"></canvas>
    </div>

    <div class="controls-section">
      <div class="input-group">
        <label>Viewer:</label>
        <input type="text" id="viewerName" value="Penonton_TikTok" placeholder="Nama viewer...">
        <button class="btn btn-green" id="openAssetModal">📁 Upload Aset</button>
      </div>

      <div class="gift-grid">
        <button class="btn btn-pink" onclick="triggerGift('rose')">🌹 Angkot Push</button>
        <button class="btn btn-red" onclick="triggerGift('meteor')">☄️ Meteor Api</button>
        <button class="btn btn-orange" onclick="triggerGift('truck')">🚚 Truk Sound</button>
        <button class="btn btn-blue" onclick="triggerGift('hero')">🦸 Luffy / Boost</button>
      </div>
    </div>
  </div>

  <!-- Modal Asset Manager 3 Layer -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 style="font-size: 1rem; margin-bottom: 10px;">Upload Aset Gambar (3-Layer Parallax)</h2>
      <div class="asset-uploader-grid">
        <div class="asset-item">
          <label>1. Layer Belakang (Pemandangan Gunung/Langit - Fullscreen)</label>
          <input type="file" accept="image/*" onchange="uploadAsset(event, 'bgFar')">
          <div class="preview-box"><img id="prev_bgFar"></div>
        </div>
        <div class="asset-item">
          <label>2. Layer Tengah (Pohon Sawit Landscape PNG Transparan)</label>
          <input type="file" accept="image/*" onchange="uploadAsset(event, 'bgMid')">
          <div class="preview-box"><img id="prev_bgMid"></div>
        </div>
        <div class="asset-item">
          <label>3. Layer Depan (Tekstur Medan/Tanah)</label>
          <input type="file" accept="image/*" onchange="uploadAsset(event, 'ground')">
          <div class="preview-box"><img id="prev_ground"></div>
        </div>
        <div class="asset-item">
          <label>4. Bodi Gran Max (PNG Transparan)</label>
          <input type="file" accept="image/*" onchange="uploadAsset(event, 'carBody')">
          <div class="preview-box"><img id="prev_carBody"></div>
        </div>
        <div class="asset-item">
          <label>5. Roda Mobil (PNG Transparan)</label>
          <input type="file" accept="image/*" onchange="uploadAsset(event, 'wheel')">
          <div class="preview-box"><img id="prev_wheel"></div>
        </div>
        <div class="asset-item">
          <label>6. Mobil Angkot</label>
          <input type="file" accept="image/*" onchange="uploadAsset(event, 'angkot')">
          <div class="preview-box"><img id="prev_angkot"></div>
        </div>
        <div class="asset-item">
          <label>7. Meteor Api (PNG)</label>
          <input type="file" accept="image/*" onchange="uploadAsset(event, 'meteor')">
          <div class="preview-box"><img id="prev_meteor"></div>
        </div>
        <div class="asset-item">
          <label>8. Truk Sound Horeg</label>
          <input type="file" accept="image/*" onchange="uploadAsset(event, 'truck')">
          <div class="preview-box"><img id="prev_truck"></div>
        </div>
      </div>
      <div style="margin-top: 12px; display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn btn-red" onclick="clearAssets()">Reset</button>
        <button class="btn btn-green" id="closeAssetModal">Simpan</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const assets = {
      bgFar: new Image(),
      bgMid: new Image(),
      ground: new Image(),
      carBody: new Image(),
      wheel: new Image(),
      angkot: new Image(),
      meteor: new Image(),
      truck: new Image()
    };

    let groundPattern = null;

    function loadSavedAssets() {
      const saved = JSON.parse(localStorage.getItem('mbg_racing_assets') || '{}');
      Object.keys(assets).forEach(key => {
        if (saved[key]) {
          assets[key].src = saved[key];
          document.getElementById(`prev_${key}`).src = saved[key];
          if (key === 'ground') {
            assets[key].onload = () => {
              groundPattern = ctx.createPattern(assets.ground, 'repeat');
            };
          }
        }
      });
    }

    function uploadAsset(e, key) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          assets[key].src = evt.target.result;
          document.getElementById(`prev_${key}`).src = evt.target.result;
          const saved = JSON.parse(localStorage.getItem('mbg_racing_assets') || '{}');
          saved[key] = evt.target.result;
          localStorage.setItem('mbg_racing_assets', JSON.stringify(saved));
          
          if (key === 'ground') {
            assets.ground.onload = () => {
              groundPattern = ctx.createPattern(assets.ground, 'repeat');
            };
          }
        };
        reader.readAsDataURL(file);
      }
    }

    function clearAssets() {
      localStorage.removeItem('mbg_racing_assets');
      groundPattern = null;
      Object.keys(assets).forEach(key => { assets[key].src = ''; document.getElementById(`prev_${key}`).src = ''; });
    }

    // TERRAIN MATH GENERATOR
    function getTerrainHeight(x) {
      return Math.sin(x * 0.003) * 45 + Math.sin(x * 0.008) * 20 + (canvas.height - 130);
    }

    function getTerrainAngle(x) {
      const dx = 5;
      const y1 = getTerrainHeight(x - dx);
      const y2 = getTerrainHeight(x + dx);
      return Math.atan2(y2 - y1, dx * 2);
    }

    // Game State
    let distance = 0;
    let worldX = 150;
    let carSpeed = 3.5;
    let carY = 0;
    let carAngle = 0;
    let verticalVelocity = 0;

    let activeEvents = [];
    let particles = [];
    let bannerText = '';
    let bannerTimer = 0;

    function triggerGift(type) {
      const user = document.getElementById('viewerName').value || 'Penonton';
      
      if (type === 'rose') {
        bannerText = `🌹 ${user} mengirim Angkot Push!`;
        activeEvents.push({ type: 'angkot', x: worldX + 350, speed: -6 });
      } else if (type === 'meteor') {
        bannerText = `☄️ ${user} menjatuhkan Meteor Api!`;
        activeEvents.push({ type: 'meteor', x: worldX + 80, y: -80, targetY: getTerrainHeight(worldX) });
      } else if (type === 'truck') {
        bannerText = `🚚 ${user} membantu dengan Truk Sound!`;
        activeEvents.push({ type: 'truck', x: worldX - 250, speed: 7.5 });
      } else if (type === 'hero') {
        bannerText = `🦸 ${user} memanggil Luffy / Boost!`;
        carSpeed = 9.5;
        setTimeout(() => carSpeed = 3.5, 2000);
      }
      bannerTimer = 180;
    }

    function createExplosion(x, y) {
      for (let i = 0; i < 18; i++) {
        particles.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          size: Math.random() * 6 + 3,
          life: 25,
          color: Math.random() > 0.5 ? '#f97316' : '#ef4444'
        });
      }
    }

    function update() {
      worldX += carSpeed;
      distance = Math.floor(worldX);

      const targetY = getTerrainHeight(worldX);
      const targetAngle = getTerrainAngle(worldX);

      carY += (targetY - carY) * 0.25 + verticalVelocity;
      carAngle += (targetAngle - carAngle) * 0.25;
      verticalVelocity *= 0.8;

      activeEvents.forEach((ev, i) => {
        if (ev.type === 'angkot') {
          ev.x += ev.speed;
          if (Math.abs(ev.x - worldX) < 60) {
            carSpeed = -2;
            setTimeout(() => carSpeed = 3.5, 1400);
          }
        } else if (ev.type === 'meteor') {
          ev.y += 14;
          if (ev.y >= ev.targetY - 20) {
            createExplosion(120, carY - 15);
            if (Math.abs(ev.x - worldX) < 100) {
              verticalVelocity = -15;
              carSpeed = 0;
              setTimeout(() => carSpeed = 3.5, 1200);
            }
            activeEvents.splice(i, 1);
          }
        } else if (ev.type === 'truck') {
          ev.x += ev.speed;
          if (ev.x >= worldX - 60 && ev.x <= worldX) {
            carSpeed = 7.5;
            setTimeout(() => carSpeed = 3.5, 1200);
          }
        }
      });

      particles.forEach((p, i) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      });

      if (bannerTimer > 0) bannerTimer--;
    }

    // DRAW PALM TREE PROCEDURAL (Fallback jika bgMid kosong)
    function drawPalmTree(x, y, scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      ctx.fillStyle = '#78350f';
      ctx.beginPath();
      ctx.moveTo(-8, 0);
      ctx.lineTo(-5, -80);
      ctx.lineTo(5, -80);
      ctx.lineTo(8, 0);
      ctx.fill();

      ctx.save();
      ctx.translate(0, -80);
      ctx.strokeStyle = '#15803d';
      ctx.lineWidth = 4;
      
      const angles = [-2.2, -1.8, -1.2, -0.6, 0, 0.6, 1.2, 1.8, 2.2];
      angles.forEach(ang => {
        ctx.save();
        ctx.rotate(ang);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(25, -20, 50, -10);
        ctx.stroke();
        ctx.restore();
      });
      ctx.restore();

      ctx.restore();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // --- LAPISAN 1: Paling Belakang (Gunung/Langit - FULLSCREEN, Kecepatan 10%) ---
      if (assets.bgFar.complete && assets.bgFar.src) {
        const bgFarWidth = canvas.width;
        const bgFarOffset = -(worldX * 0.1) % bgFarWidth;
        ctx.drawImage(assets.bgFar, bgFarOffset, 0, bgFarWidth, canvas.height);
        ctx.drawImage(assets.bgFar, bgFarOffset + bgFarWidth, 0, bgFarWidth, canvas.height);
      } else {
        const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        skyGrad.addColorStop(0, '#0284c7');
        skyGrad.addColorStop(0.5, '#38bdf8');
        skyGrad.addColorStop(1, '#bae6fd');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Fallback Gunung
        ctx.fillStyle = '#1e3a8a';
        ctx.beginPath();
        ctx.moveTo(-50, canvas.height - 100);
        ctx.lineTo(canvas.width * 0.5, canvas.height - 280);
        ctx.lineTo(canvas.width + 50, canvas.height - 100);
        ctx.fill();
      }

      // --- LAPISAN 2: Tengah (Pepohonan Sawit LANDSCAPE - Tidak Fullscreen, Kecepatan 40%) ---
      if (assets.bgMid.complete && assets.bgMid.src) {
        // Menjaga rasio landscape agar gambar tidak tertarik melar ke atas
        const imgRatio = assets.bgMid.width / assets.bgMid.height;
        // Atur tinggi layer mid sekitar 45% dari tinggi canvas
        const midHeight = canvas.height * 0.45;
        const midWidth = midHeight * imgRatio;
        
        // Posisikan bagian bawah gambar sawit persis di dekat garis jalanan (terrain)
        const midY = canvas.height - midHeight - 90;
        const bgMidOffset = -(worldX * 0.4) % midWidth;

        // Render berulang (tile) secara horizontal tanpa memotong aspek rasio
        for (let x = bgMidOffset - midWidth; x < canvas.width + midWidth; x += midWidth) {
          ctx.drawImage(assets.bgMid, x, midY, midWidth, midHeight);
        }
      } else {
        // Fallback Pohon Sawit Prosedural
        const sawitSpacing = 160;
        const startIdx = Math.floor((worldX - 200) / sawitSpacing);
        for (let i = startIdx - 1; i < startIdx + 5; i++) {
          const treeWorldX = i * sawitSpacing;
          const screenTreeX = treeWorldX - (worldX * 0.4) + 120;
          const treeY = getTerrainHeight(treeWorldX) - 5;
          drawPalmTree(screenTreeX, treeY, 0.85);
        }
      }

      // --- LAPISAN 3: Depan (Tekstur Medan / Jalan Bergelombang) ---
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(0, canvas.height);
      for (let screenX = 0; screenX <= canvas.width; screenX += 4) {
        const actualWorldX = worldX - 120 + screenX;
        const h = getTerrainHeight(actualWorldX);
        ctx.lineTo(screenX, h);
      }
      ctx.lineTo(canvas.width, canvas.height);

      if (assets.ground.complete && assets.ground.src) {
        const groundOffsetX = -(worldX % assets.ground.width);
        ctx.save();
        ctx.translate(groundOffsetX, 0);
        if (!groundPattern) groundPattern = ctx.createPattern(assets.ground, 'repeat');
        ctx.fillStyle = groundPattern;
        ctx.fill();
        ctx.restore();
      } else {
        const dirtGrad = ctx.createLinearGradient(0, canvas.height - 200, 0, canvas.height);
        dirtGrad.addColorStop(0, '#542d10');
        dirtGrad.addColorStop(0.5, '#3b1d07');
        dirtGrad.addColorStop(1, '#241002');
        ctx.fillStyle = dirtGrad;
        ctx.fill();
      }

      // Garis Rumput Atas Jalan
      ctx.strokeStyle = '#15803d';
      ctx.lineWidth = 8;
      ctx.stroke();
      ctx.strokeStyle = '#22c55e';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.restore();

      // Top Meter Bar
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.fillRect(15, 15, canvas.width - 30, 36);
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(15, 15, canvas.width - 30, 36);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`🏁 ${distance} m / 30.000 m`, canvas.width / 2, 38);
      ctx.textAlign = 'left';

      // Render Gran Max Van & Roda
      const screenCarX = 120;
      ctx.save();
      ctx.translate(screenCarX, carY - 20);
      ctx.rotate(carAngle);

      if (assets.carBody.complete && assets.carBody.src) {
        ctx.drawImage(assets.carBody, -55, -30, 110, 55);
      } else {
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(-55, -28, 110, 50);
        ctx.fillStyle = '#1e3a8a';
        ctx.font = 'bold 8px sans-serif';
        ctx.fillText('SATUAN PELAYANAN', -48, -10);
        ctx.fillText('PEMENUHAN GIZI', -48, 2);
      }

      const wheelSpin = worldX * 0.12;
      drawWheel(-35, 16, 13, wheelSpin);
      drawWheel(35, 16, 13, wheelSpin);
      ctx.restore();

      // Render Active Gift Events
      activeEvents.forEach(ev => {
        const screenEvX = ev.x - worldX + 120;
        const evY = getTerrainHeight(ev.x);

        if (ev.type === 'angkot') {
          if (assets.angkot.complete && assets.angkot.src) {
            ctx.drawImage(assets.angkot, screenEvX - 40, evY - 40, 80, 40);
          } else {
            ctx.fillStyle = '#eab308';
            ctx.fillRect(screenEvX - 35, evY - 35, 70, 35);
          }
        } else if (ev.type === 'meteor') {
          if (assets.meteor.complete && assets.meteor.src) {
            ctx.drawImage(assets.meteor, screenEvX - 30, ev.y - 30, 60, 60);
          } else {
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(screenEvX, ev.y, 20, 0, Math.PI * 2);
            ctx.fill();
          }
        } else if (ev.type === 'truck') {
          if (assets.truck.complete && assets.truck.src) {
            ctx.drawImage(assets.truck, screenEvX - 45, evY - 45, 90, 45);
          } else {
            ctx.fillStyle = '#0284c7';
            ctx.fillRect(screenEvX - 40, evY - 40, 80, 40);
          }
        }
      });

      // Render Explosions
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // Banner Gift TikTok
      if (bannerTimer > 0) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
        ctx.fillRect(15, 60, canvas.width - 30, 36);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(15, 60, canvas.width - 30, 36);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText(bannerText, 25, 83);
      }
    }

    function drawWheel(x, y, radius, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      if (assets.wheel.complete && assets.wheel.src) {
        ctx.drawImage(assets.wheel, -radius, -radius, radius * 2, radius * 2);
      } else {
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }
      ctx.restore();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    document.getElementById('openAssetModal').onclick = () => document.getElementById('modalOverlay').classList.add('active');
    document.getElementById('closeAssetModal').onclick = () => document.getElementById('modalOverlay').classList.remove('active');

    loadSavedAssets();
    loop();
  </script>
</body>
</html>
